<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiral Nav – Items in Spiral Pattern</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌀 Spiral Nav</h1>
    <p class="subtitle">Items arranged in a spiral pattern</p>

    <div class="spiral-container">
      <div class="spiral-scene">
        <div class="spiral-nav" id="spiralNav">
          <!-- Items will be generated by JS -->
        </div>
        <div class="center-indicator" id="centerIndicator">
          <span class="center-icon">✦</span>
          <span class="center-label">Menu</span>
        </div>
      </div>
      
      <!-- Info overlay -->
      <div class="info-overlay">
        <span class="spiral-status" id="spiralStatus">🌀 Spiral</span>
        <span class="item-count" id="itemCount">✦ 0 items</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn expand" id="expandBtn">📤 Expand</button>
      <button class="ctrl-btn collapse" id="collapseBtn">📥 Collapse</button>
      <button class="ctrl-btn toggle" id="toggleBtn">🔄 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Spiral Tightness</span>
      <input type="range" id="tightnessSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="tightnessValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Items</span>
      <input type="range" id="countSlider" min="5" max="20" value="12" step="1" />
      <span class="slider-value" id="countValue">12</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Rotation Speed</span>
      <input type="range" id="speedSlider" min="0" max="100" value="30" />
      <span class="slider-value" id="speedValue">30%</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌀 Spiral navigation — click items to select</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>E</kbd> Expand · <kbd>C</kbd> Collapse · <kbd>T</kbd> Toggle · <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const spiralNav = document.getElementById('spiralNav');
      const centerIndicator = document.getElementById('centerIndicator');
      const spiralStatus = document.getElementById('spiralStatus');
      const itemCount = document.getElementById('itemCount');
      const expandBtn = document.getElementById('expandBtn');
      const collapseBtn = document.getElementById('collapseBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const tightnessSlider = document.getElementById('tightnessSlider');
      const tightnessValue = document.getElementById('tightnessValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      // State
      let items = [];
      let isExpanded = true;
      let currentAngle = 0;
      let targetAngle = 0;
      let animationId = null;
      let time = 0;
      let selectedIndex = -1;

      // Item labels and icons
      const ITEM_DATA = [
        { label: 'Home', icon: '🏠' },
        { label: 'Explore', icon: '🔍' },
        { label: 'Gallery', icon: '🖼️' },
        { label: 'Music', icon: '🎵' },
        { label: 'Videos', icon: '🎬' },
        { label: 'Profile', icon: '👤' },
        { label: 'Settings', icon: '⚙️' },
        { label: 'Messages', icon: '💬' },
        { label: 'Notifications', icon: '🔔' },
        { label: 'Favorites', icon: '❤️' },
        { label: 'History', icon: '📜' },
        { label: 'Downloads', icon: '📥' },
        { label: 'Share', icon: '📤' },
        { label: 'Help', icon: '❓' },
        { label: 'About', icon: 'ℹ️' },
        { label: 'Logout', icon: '🚪' },
        { label: 'Dashboard', icon: '📊' },
        { label: 'Analytics', icon: '📈' },
        { label: 'Community', icon: '👥' },
        { label: 'Store', icon: '🛒' }
      ];

      // ----- Generate spiral items -----
      function generateItems(count) {
        spiralNav.innerHTML = '';
        items = [];
        
        const total = Math.min(count, ITEM_DATA.length);
        
        for (let i = 0; i < total; i++) {
          const data = ITEM_DATA[i % ITEM_DATA.length];
          const item = document.createElement('div');
          item.className = 'spiral-item';
          item.dataset.index = i;
          
          const icon = document.createElement('span');
          icon.className = 'item-icon';
          icon.textContent = data.icon;
          
          const label = document.createElement('span');
          label.className = 'item-label';
          label.textContent = data.label;
          
          item.appendChild(icon);
          item.appendChild(label);
          
          // Click handler
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            selectItem(i);
          });
          
          // Hover effect
          item.addEventListener('mouseenter', () => {
            item.style.transform += ' scale(1.1)';
          });
          item.addEventListener('mouseleave', () => {
            item.style.transform = item.style.transform.replace(' scale(1.1)', '');
          });
          
          spiralNav.appendChild(item);
          items.push(item);
        }
        
        itemCount.textContent = `✦ ${items.length} items`;
        updatePositions(true);
      }

      // ----- Update positions -----
      function updatePositions(instant = false) {
        const count = items.length;
        const tightness = parseInt(tightnessSlider.value) / 5;
        const radius = Math.min(300, 60 + count * 8);
        const angleStep = 0.8 / tightness;
        const totalAngle = count * angleStep;
        
        // Center position
        const centerX = spiralNav.offsetWidth / 2 || 250;
        const centerY = spiralNav.offsetHeight / 2 || 250;
        
        // Calculate spiral positions
        items.forEach((item, i) => {
          const t = i / count;
          const angle = t * totalAngle + currentAngle;
          const r = radius * (0.3 + 0.7 * t);
          
          // Add some vertical offset for 3D effect
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r * 0.6;
          
          // Scale based on position (depth effect)
          const depth = 0.6 + 0.4 * (1 - t);
          const scale = depth * (isExpanded ? 1 : 0.6 + 0.4 * t);
          
          // Opacity based on position
          const opacity = isExpanded ? (0.3 + 0.7 * (1 - t * 0.5)) : (0.1 + 0.9 * t);
          
          // Apply transforms
          if (instant) {
            item.style.transition = 'none';
          } else {
            item.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
          }
          
          item.style.left = (x - 30) + 'px';
          item.style.top = (y - 30) + 'px';
          item.style.transform = `scale(${scale}) rotate(${angle * 0.5}deg)`;
          item.style.opacity = opacity;
          item.style.zIndex = Math.floor(t * 100);
          
          // Color variation
          const hue = 200 + t * 120;
          const lightness = 40 + (1 - t) * 30;
          item.style.background = `linear-gradient(145deg, 
            hsl(${hue}, 70%, ${lightness + 10}%), 
            hsl(${hue + 20}, 70%, ${lightness}%)
          )`;
        });
        
        // Update status
        spiralStatus.textContent = isExpanded ? '🌀 Expanded' : '🌀 Collapsed';
        
        // Update center indicator
        centerIndicator.style.transform = `scale(${isExpanded ? 1 : 0.8})`;
      }

      // ----- Select item -----
      function selectItem(index) {
        if (selectedIndex === index) {
          // Deselect
          if (selectedIndex >= 0) {
            items[selectedIndex].classList.remove('selected');
          }
          selectedIndex = -1;
          status.textContent = '🌀 Item deselected';
          return;
        }
        
        // Remove previous selection
        if (selectedIndex >= 0) {
          items[selectedIndex].classList.remove('selected');
        }
        
        selectedIndex = index;
        items[index].classList.add('selected');
        const data = ITEM_DATA[index % ITEM_DATA.length];
        status.textContent = `✅ Selected: ${data.icon} ${data.label}`;
        centerIndicator.querySelector('.center-label').textContent = data.label;
        centerIndicator.querySelector('.center-icon').textContent = data.icon;
      }

      // ----- Expand -----
      function expand() {
        isExpanded = true;
        updatePositions();
        status.textContent = '📤 Expanded spiral';
      }

      // ----- Collapse -----
      function collapse() {
        isExpanded = false;
        updatePositions();
        status.textContent = '📥 Collapsed spiral';
      }

      // ----- Toggle -----
      function toggleSpiral() {
        isExpanded ? collapse() : expand();
      }

      // ----- Reset -----
      function resetSpiral() {
        isExpanded = true;
        currentAngle = 0;
        targetAngle = 0;
        selectedIndex = -1;
        items.forEach(item => item.classList.remove('selected'));
        tightnessSlider.value = 5;
        tightnessValue.textContent = '5×';
        countSlider.value = 12;
        countValue.textContent = '12';
        speedSlider.value = 30;
        speedValue.textContent = '30%';
        generateItems(12);
        centerIndicator.querySelector('.center-label').textContent = 'Menu';
        centerIndicator.querySelector('.center-icon').textContent = '✦';
        status.textContent = '↺ Spiral reset';
        spiralStatus.textContent = '🌀 Spiral';
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        
        // Smooth angle interpolation
        const diff = targetAngle - currentAngle;
        if (Math.abs(diff) > 0.001) {
          const speed = parseInt(speedSlider.value) / 100 * 0.1;
          currentAngle += diff * speed * 0.5;
        } else {
          currentAngle = targetAngle;
        }
        
        // Auto-rotate slowly if not interacting
        if (speedSlider.value > 0) {
          const autoSpeed = parseInt(speedSlider.value) / 100 * 0.005;
          targetAngle += autoSpeed;
        }
        
        updatePositions();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      expandBtn.addEventListener('click', expand);
      collapseBtn.addEventListener('click', collapse);
      toggleBtn.addEventListener('click', toggleSpiral);
      resetBtn.addEventListener('click', resetSpiral);

      tightnessSlider.addEventListener('input', (e) => {
        tightnessValue.textContent = e.target.value + '×';
        updatePositions();
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateItems(val);
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '%';
      });

      // Click on center to toggle
      centerIndicator.addEventListener('click', toggleSpiral);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'e' || e.key === 'E') {
          e.preventDefault();
          expand();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          collapse();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleSpiral();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetSpiral();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleSpiral();
        }
        // Number keys to select items
        const num = parseInt(e.key);
        if (num >= 1 && num <= 9 && num <= items.length) {
          e.preventDefault();
          selectItem(num - 1);
        }
      });

      // Click on spiral background to deselect
      spiralNav.addEventListener('click', (e) => {
        if (e.target === spiralNav) {
          if (selectedIndex >= 0) {
            items[selectedIndex].classList.remove('selected');
            selectedIndex = -1;
            status.textContent = '🌀 Item deselected';
            centerIndicator.querySelector('.center-label').textContent = 'Menu';
            centerIndicator.querySelector('.center-icon').textContent = '✦';
          }
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          updatePositions(true);
        }, 200);
      });

      // ----- Init -----
      function init() {
        generateItems(12);
        startAnimation();
        status.textContent = '🌀 Spiral navigation — click items to select, press 1-9 to jump!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
