<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>🎆 Light Festival – Dancing Colored Lights</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>🎆 Light Festival</h1>
            <div class="controls">
                <button class="control-btn" id="toggleBtn" title="Pause/Resume">⏸️</button>
                <button class="control-btn" id="resetBtn" title="Reset">🔄</button>
                <button class="control-btn" id="patternBtn" title="Change pattern">🎭 Pattern</button>
                <button class="control-btn" id="speedBtn" title="Toggle speed">⚡ Speed</button>
            </div>
        </header>

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="festivalCanvas" width="800" height="600"></canvas>
            <div class="stats-overlay" id="statsOverlay">
                <span id="lightCount">✨ 0 lights</span>
                <span id="patternDisplay">🎭 Wave</span>
                <span id="speedDisplay">⚡ Medium</span>
            </div>
            <div class="hint" id="hint">🎆 Watch the lights dance!</div>
        </div>

        <!-- Footer Controls -->
        <footer class="footer">
            <div class="slider-group">
                <label>✨ Density</label>
                <input type="range" id="densitySlider" min="10" max="80" value="40" step="1" />
                <span id="densityLabel">40</span>
            </div>
            <div class="slider-group">
                <label>🌈 Spread</label>
                <input type="range" id="spreadSlider" min="20" max="200" value="100" step="5" />
                <span id="spreadLabel">100</span>
            </div>
            <div class="slider-group">
                <label>💫 Trail</label>
                <input type="range" id="trailSlider" min="0" max="50" value="20" step="1" />
                <span id="trailLabel">20</span>
            </div>
        </footer>
    </div>

    <script>
        // ============================================================
        // Light Festival – Full JavaScript (embedded)
        // ============================================================

        (function() {
            'use strict';

            // --- DOM refs ---
            const canvas = document.getElementById('festivalCanvas');
            const ctx = canvas.getContext('2d');
            const lightCount = document.getElementById('lightCount');
            const patternDisplay = document.getElementById('patternDisplay');
            const speedDisplay = document.getElementById('speedDisplay');
            const hint = document.getElementById('hint');
            const toggleBtn = document.getElementById('toggleBtn');
            const resetBtn = document.getElementById('resetBtn');
            const patternBtn = document.getElementById('patternBtn');
            const speedBtn = document.getElementById('speedBtn');
            const densitySlider = document.getElementById('densitySlider');
            const densityLabel = document.getElementById('densityLabel');
            const spreadSlider = document.getElementById('spreadSlider');
            const spreadLabel = document.getElementById('spreadLabel');
            const trailSlider = document.getElementById('trailSlider');
            const trailLabel = document.getElementById('trailLabel');

            // --- Canvas sizing ---
            const W = 800,
                H = 600;
            canvas.width = W;
            canvas.height = H;

            // --- State ---
            let isPaused = false;
            let time = 0;
            let animationId = null;
            let patternIndex = 0;
            let speedLevel = 0; // 0: slow, 1: medium, 2: fast

            // --- Parameters ---
            let density = 40;
            let spread = 100;
            let trail = 20;

            // --- Patterns ---
            const patterns = [
                { name: 'Wave', desc: '🌊 Flowing waves' },
                { name: 'Circle', desc: '⭕ Spinning circles' },
                { name: 'Burst', desc: '💥 Radiant bursts' },
                { name: 'Spiral', desc: '🌀 Spiraling lights' },
                { name: 'Pulse', desc: '💓 Heartbeat pulse' },
                { name: 'Random', desc: '🎲 Chaotic dance' },
            ];

            // --- Colors ---
            const colors = [
                '#ff1744', // Red
                '#ff9100', // Orange
                '#ffea00', // Yellow
                '#00e676', // Green
                '#2979ff', // Blue
                '#d500f9', // Purple
                '#00bcd4', // Cyan
                '#ff4081', // Pink
                '#ffab00', // Amber
                '#76ff03', // Lime
                '#18ffff', // Aqua
                '#e040fb', // Magenta
            ];

            // --- Light class ---
            class Light {
                constructor(index, total) {
                    this.index = index;
                    this.total = total;
                    this.reset();
                }

                reset() {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 50 + Math.random() * 250;

                    this.x = W / 2 + Math.cos(angle) * radius;
                    this.y = H / 2 + Math.sin(angle) * radius * 0.6;
                    this.angle = angle;
                    this.radius = radius;
                    this.speed = 0.3 + Math.random() * 0.7;
                    this.phase = Math.random() * Math.PI * 2;
                    this.size = 3 + Math.random() * 6;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.opacity = 0.3 + Math.random() * 0.7;
                    this.glowSize = this.size * (2 + Math.random() * 3);

                    // Movement offsets for pattern variation
                    this.offsetX = (Math.random() - 0.5) * 100;
                    this.offsetY = (Math.random() - 0.5) * 100;
                    this.pulsePhase = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.01 + Math.random() * 0.02;
                }

                update(pattern, speed, spread, time) {
                    const speedFactor = speed === 0 ? 0.5 : speed === 1 ? 1 : 1.8;
                    const t = time * 0.02 * speedFactor;
                    const spreadFactor = spread / 100;

                    let dx = 0,
                        dy = 0;
                    const centerX = W / 2;
                    const centerY = H / 2;

                    switch (pattern) {
                        case 'Wave':
                            const waveX = Math.sin(t + this.phase) * spreadFactor * 200;
                            const waveY = Math.cos(t * 0.7 + this.phase * 0.5) * spreadFactor * 150;
                            dx = waveX + this.offsetX * 0.3;
                            dy = waveY + this.offsetY * 0.3;
                            this.x = centerX + dx;
                            this.y = centerY + dy;
                            break;

                        case 'Circle':
                            const circleAngle = t * 0.5 + (this.index / this.total) * Math.PI * 2;
                            const circleRadius = 80 + Math.sin(t * 0.3 + this.phase) * 60 * spreadFactor;
                            this.x = centerX + Math.cos(circleAngle) * circleRadius + this.offsetX * 0.2;
                            this.y = centerY + Math.sin(circleAngle) * circleRadius * 0.7 + this.offsetY * 0.2;
                            break;

                        case 'Burst':
                            const burstAngle = t * 0.3 + this.phase;
                            const burstDist = 50 + (Math.sin(t * 0.5 + this.phase * 2) * 0.5 + 0.5) * 200 * spreadFactor;
                            this.x = centerX + Math.cos(burstAngle) * burstDist + this.offsetX * 0.2;
                            this.y = centerY + Math.sin(burstAngle) * burstDist * 0.6 + this.offsetY * 0.2;
                            break;

                        case 'Spiral':
                            const spiralAngle = t * 0.4 + this.phase + (this.index / this.total) * Math.PI * 4;
                            const spiralRadius = 50 + (this.index / this.total) * 200 * spreadFactor +
                                Math.sin(t * 0.2 + this.phase) * 30;
                            this.x = centerX + Math.cos(spiralAngle) * spiralRadius + this.offsetX * 0.1;
                            this.y = centerY + Math.sin(spiralAngle) * spiralRadius * 0.6 + this.offsetY * 0.1;
                            break;

                        case 'Pulse':
                            const pulseAngle = t * 0.5 + (this.index / this.total) * Math.PI * 2;
                            const pulseRadius = 80 + Math.sin(t * 0.8 + this.phase) * 80 * spreadFactor;
                            const pulseScale = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.3 + this.phase * 0.5));
                            this.x = centerX + Math.cos(pulseAngle) * pulseRadius * pulseScale + this.offsetX * 0.2;
                            this.y = centerY + Math.sin(pulseAngle) * pulseRadius * pulseScale * 0.6 + this.offsetY * 0.2;
                            break;

                        case 'Random':
                            // Smooth random walk
                            this.offsetX += (Math.random() - 0.5) * 0.5;
                            this.offsetY += (Math.random() - 0.5) * 0.5;
                            this.offsetX *= 0.99;
                            this.offsetY *= 0.99;
                            this.x = centerX + this.offsetX * spreadFactor * 3;
                            this.y = centerY + this.offsetY * spreadFactor * 2;
                            break;

                        default:
                            this.x = centerX + Math.sin(t + this.phase) * 200 * spreadFactor;
                            this.y = centerY + Math.cos(t * 0.7 + this.phase) * 150 * spreadFactor;
                    }

                    // Boundary clamping
                    this.x = Math.max(10, Math.min(W - 10, this.x));
                    this.y = Math.max(10, Math.min(H - 10, this.y));

                    // Pulse opacity
                    this.pulsePhase += this.pulseSpeed * speedFactor;
                    this.opacity = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(this.pulsePhase));
                }

                draw(ctx, trailAmount) {
                    const alpha = this.opacity * 0.9;

                    // Glow
                    ctx.save();
                    const glowSize = this.glowSize * (0.8 + 0.4 * Math.sin(this.pulsePhase));

                    const grad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, glowSize
                    );

                    const color = this.color;
                    const r = parseInt(color.slice(1, 3), 16);
                    const g = parseInt(color.slice(3, 5), 16);
                    const b = parseInt(color.slice(5, 7), 16);

                    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.8})`);
                    grad.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${alpha * 0.4})`);
                    grad.addColorStop(0.7, `rgba(${r}, ${g}, ${b}, ${alpha * 0.1})`);
                    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                    ctx.shadowBlur = glowSize * 0.5;
                    ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${alpha * 0.2})`;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Core
                    ctx.shadowBlur = glowSize * 0.3;
                    ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`;
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Main light
                    ctx.shadowBlur = glowSize * 0.2;
                    ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`;
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.9})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();

                    // Bright core
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(this.x - this.size * 0.2, this.y - this.size * 0.2, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // Trail
                    if (trailAmount > 0 && this.trail) {
                        ctx.save();
                        for (let i = 0; i < this.trail.length; i++) {
                            const t = i / this.trail.length;
                            const trailAlpha = alpha * t * 0.15 * (trailAmount / 50);
                            const trailSize = this.size * t * 0.5;

                            ctx.globalAlpha = trailAlpha;
                            ctx.fillStyle = this.color;
                            ctx.shadowBlur = 0;
                            ctx.beginPath();
                            ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                }

                setTrail(trail) {
                    if (!this.trail) this.trail = [];
                    if (trail > 0) {
                        this.trail.push({ x: this.x, y: this.y });
                        if (this.trail.length > Math.floor(trail / 2) + 1) {
                            this.trail.shift();
                        }
                    } else {
                        this.trail = [];
                    }
                }
            }

            // --- Lights array ---
            let lights = [];

            // --- Create lights ---
            function createLights(count) {
                lights = [];
                for (let i = 0; i < count; i++) {
                    lights.push(new Light(i, count));
                }
                updateStats();
            }

            // --- Update stats ---
            function updateStats() {
                lightCount.textContent = `✨ ${lights.length} lights`;
                patternDisplay.textContent = patterns[patternIndex].desc;
                const speedLabels = ['🐢 Slow', '⚡ Medium', '⚡⚡ Fast'];
                speedDisplay.textContent = speedLabels[speedLevel];
            }

            // --- Render background ---
            function renderBackground(ctx) {
                // Dark gradient with slight color
                const grad = ctx.createRadialGradient(
                    W / 2, H / 2, 50,
                    W / 2, H / 2, 450
                );
                grad.addColorStop(0, '#0a0f1a');
                grad.addColorStop(0.4, '#060a12');
                grad.addColorStop(0.7, '#04080e');
                grad.addColorStop(1, '#020408');

                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Subtle stars
                ctx.save();
                ctx.globalAlpha = 0.03;
                for (let i = 0; i < 50; i++) {
                    const x = (i * 137.5 + 20) % W;
                    const y = (i * 97.3 + 10) % H;
                    const s = 0.5 + Math.sin(i * 2.3) * 0.5;
                    ctx.beginPath();
                    ctx.arc(x, y, s, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }
                ctx.restore();

                // Ground glow
                const groundGrad = ctx.createRadialGradient(
                    W / 2, H - 20, 50,
                    W / 2, H - 20, 300
                );
                groundGrad.addColorStop(0, 'rgba(20, 30, 50, 0.1)');
                groundGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(0, H - 100, W, 100);
            }

            // --- Main render loop ---
            function render() {
                time++;

                // Clear with trail effect
                if (!isPaused) {
                    const trailAlpha = Math.max(0, 1 - trail / 100);
                    ctx.fillStyle = `rgba(2, 4, 8, ${trailAlpha * 0.8 + 0.2})`;
                    ctx.fillRect(0, 0, W, H);
                } else {
                    ctx.clearRect(0, 0, W, H);
                }

                // Render background (only when trail is low or paused)
                if (trail < 10 || isPaused) {
                    renderBackground(ctx);
                }

                // Update lights
                if (!isPaused) {
                    const pattern = patterns[patternIndex].name;
                    for (const light of lights) {
                        light.update(pattern, speedLevel, spread, time);
                        light.setTrail(trail);
                    }
                }

                // Draw lights
                ctx.save();
                // Sort by size for depth effect
                const sortedLights = [...lights].sort((a, b) => a.size - b.size);
                for (const light of sortedLights) {
                    light.draw(ctx, trail);
                }
                ctx.restore();

                // Continue animation
                animationId = requestAnimationFrame(render);
            }

            // --- Controls ---
            function togglePause() {
                isPaused = !isPaused;
                toggleBtn.textContent = isPaused ? '▶️' : '⏸️';
                if (isPaused) {
                    hint.textContent = '⏸️ Paused';
                    hint.classList.remove('hidden');
                    setTimeout(() => hint.classList.add('hidden'), 1500);
                }
            }

            function resetFestival() {
                createLights(density);
                time = 0;
                hint.textContent = '🔄 Reset!';
                hint.classList.remove('hidden');
                setTimeout(() => hint.classList.add('hidden'), 1500);
            }

            function nextPattern() {
                patternIndex = (patternIndex + 1) % patterns.length;
                patternDisplay.textContent = patterns[patternIndex].desc;
                hint.textContent = `🎭 ${patterns[patternIndex].name}`;
                hint.classList.remove('hidden');
                setTimeout(() => hint.classList.add('hidden'), 1500);
                // Reset light phases for new pattern
                for (const light of lights) {
                    light.phase = Math.random() * Math.PI * 2;
                }
            }

            function cycleSpeed() {
                speedLevel = (speedLevel + 1) % 3;
                const speedLabels = ['🐢 Slow', '⚡ Medium', '⚡⚡ Fast'];
                speedDisplay.textContent = speedLabels[speedLevel];
                hint.textContent = speedLabels[speedLevel];
                hint.classList.remove('hidden');
                setTimeout(() => hint.classList.add('hidden'), 1500);
            }

            // --- Slider handlers ---
            densitySlider.addEventListener('input', function() {
                density = parseInt(this.value);
                densityLabel.textContent = density;
                createLights(density);
            });

            spreadSlider.addEventListener('input', function() {
                spread = parseInt(this.value);
                spreadLabel.textContent = spread;
            });

            trailSlider.addEventListener('input', function() {
                trail = parseInt(this.value);
                trailLabel.textContent = trail;
            });

            // --- Button events ---
            toggleBtn.addEventListener('click', togglePause);
            resetBtn.addEventListener('click', resetFestival);
            patternBtn.addEventListener('click', nextPattern);
            speedBtn.addEventListener('click', cycleSpeed);

            // --- Keyboard shortcuts ---
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    togglePause();
                }
                if (e.key === 'r' || e.key === 'R') resetFestival();
                if (e.key === 'p' || e.key === 'P') nextPattern();
                if (e.key === 's' || e.key === 'S') cycleSpeed();

                // Density adjustments
                if (e.key === 'ArrowUp' || e.key === '=') {
                    e.preventDefault();
                    density = Math.min(80, density + 2);
                    densitySlider.value = density;
                    densityLabel.textContent = density;
                    createLights(density);
                }
                if (e.key === 'ArrowDown' || e.key === '-') {
                    e.preventDefault();
                    density = Math.max(10, density - 2);
                    densitySlider.value = density;
                    densityLabel.textContent = density;
                    createLights(density);
                }
            });

            // --- Init ---
            createLights(density);
            render();

            // Hide hint after a few seconds
            setTimeout(() => hint.classList.add('hidden'), 4000);

            // --- Resize handling ---
            function handleResize() {
                // Canvas maintains aspect ratio via CSS
            }
            window.addEventListener('resize', handleResize);

            console.log('🎆 Light Festival ready!');
            console.log('Controls: Space (pause), R (reset), P (pattern), S (speed)');
            console.log('          ↑/↓ (density), patterns: Wave, Circle, Burst, Spiral, Pulse, Random');

        })();
    </script>
</body>
</html>
